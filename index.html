<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback · Lekòl Ayiti A 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1b2a;
    --ink-2:#1b3a4b;
    --paper:#faf6ef;
    --paper-2:#f2ebdd;
    --red:#c1272d;
    --red-deep:#8f1d21;
    --gold:#c79a3a;
    --line:rgba(13,27,42,.12);
    --muted:#5a6b76;
    --ok:#1f7a52;
    --shadow:0 24px 60px -28px rgba(13,27,42,.45);
    font-size:clamp(16px,1.1vw + 12px,19px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #rail{position:fixed;top:0;left:0;right:0;height:4px;background:transparent;z-index:40}
  #rail span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .5s cubic-bezier(.4,0,.2,1)}

  #brand{position:fixed;top:22px;left:26px;z-index:30;display:flex;align-items:center;gap:12px}
  #brand .mark{height:36px;width:auto;display:block}
  #brand .wm{font-family:'Fraunces';font-weight:600;font-size:.78rem;line-height:1.05;color:var(--ink)}
  #brand .wm small{display:block;font-family:'Inter';font-weight:500;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  #counter{position:fixed;bottom:20px;left:26px;z-index:30;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #counter b{color:var(--red);font-weight:600}

  #deck{position:relative;height:100dvh;width:100%}
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:96px 8vw 120px;
    opacity:0;visibility:hidden;
    transform:translateY(38px);
    transition:opacity .45s ease,transform .55s cubic-bezier(.19,1,.22,1);
    pointer-events:none;z-index:1;
  }
  .slide.active{opacity:1;visibility:visible;transform:none;pointer-events:auto;z-index:2}
  .slide.up{transform:translateY(-38px)}
  .wrap{width:100%;max-width:660px}

  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:20px}
  .eyebrow .n{font-family:'Fraunces';font-size:.9rem;color:var(--ink)}
  .eyebrow .n b{color:var(--red)}
  .eyebrow::before{content:"";width:26px;height:1.5px;background:var(--gold)}

  h1{font-family:'Fraunces';font-weight:600;font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.05;letter-spacing:-.015em}
  h2{font-family:'Fraunces';font-weight:600;font-size:clamp(1.5rem,3.4vw,2.25rem);line-height:1.14;letter-spacing:-.01em}
  .sub{margin-top:16px;font-size:1.02rem;line-height:1.55;color:var(--muted);max-width:52ch}
  .q-hint{margin-top:10px;font-size:.9rem;color:var(--muted)}

  .field{margin-top:34px}
  input[type=text],input[type=email]{
    width:100%;border:0;border-bottom:2px solid var(--line);
    background:transparent;font-family:'Fraunces';font-weight:500;
    font-size:clamp(1.4rem,3vw,1.9rem);color:var(--ink);
    padding:6px 2px 12px;transition:border-color .3s;
  }
  textarea{
    width:100%;border:1.5px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.5);font-family:'Inter';font-weight:400;
    font-size:1.05rem;line-height:1.5;color:var(--ink);
    padding:16px 18px;resize:vertical;min-height:132px;transition:border-color .3s;
  }
  input::placeholder,textarea::placeholder{color:rgba(13,27,42,.28)}
  input:focus,textarea:focus{outline:none;border-color:var(--red)}

  /* rating scale */
  .scale{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
  .scale button{
    flex:1 1 0;min-width:52px;border:1.5px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.5);cursor:pointer;padding:16px 4px 12px;
    font-family:'Fraunces';font-weight:600;font-size:1.35rem;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:border-color .18s,background .18s,transform .12s,box-shadow .18s;
  }
  .scale button:hover{border-color:var(--ink-2);transform:translateY(-2px)}
  .scale button.sel{border-color:var(--red);background:#fff;box-shadow:var(--shadow)}
  .scale button .cap{font-family:'Inter';font-weight:500;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .scale.wide button{min-width:38px;font-size:1.1rem;padding:13px 2px 10px}

  .choices{margin-top:30px;display:flex;flex-direction:column;gap:12px}
  .choices.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{
    display:flex;align-items:center;gap:14px;
    border:1.5px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.5);
    padding:15px 18px;cursor:pointer;text-align:left;width:100%;
    font-family:'Inter';font-size:1rem;color:var(--ink);
    transition:border-color .18s,background .18s,transform .12s,box-shadow .18s;
  }
  .choice:hover{border-color:var(--ink-2);transform:translateX(3px)}
  .choice.sel{border-color:var(--red);background:#fff;box-shadow:var(--shadow)}
  .choice .key{
    flex:0 0 auto;width:30px;height:30px;border-radius:7px;
    border:1.5px solid var(--line);display:grid;place-items:center;
    font-family:'Fraunces';font-weight:600;font-size:.9rem;color:var(--muted);
    transition:.18s;
  }
  .choice.sel .key{background:var(--red);border-color:var(--red);color:#fff}
  .choice.multi .key{border-radius:7px}
  .choice .lbl b{display:block;font-weight:600}
  .choice .lbl small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;font-weight:400}

  /* rating grid */
  .grid-rate{margin-top:28px;display:flex;flex-direction:column;gap:14px}
  .grid-rate .gr-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .grid-rate .gr-lbl{flex:1 1 190px;font-size:.98rem;font-weight:500}
  .grid-rate .gr-scale{display:flex;gap:7px}
  .grid-rate .gr-scale button{
    width:42px;height:42px;border:1.5px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.5);cursor:pointer;font-family:'Fraunces';
    font-weight:600;font-size:1rem;color:var(--ink);transition:.15s;
  }
  .grid-rate .gr-scale button:hover{border-color:var(--ink-2)}
  .grid-rate .gr-scale button.sel{border-color:var(--red);background:var(--red);color:#fff}

  .foot{margin-top:34px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .btn{
    font-family:'Inter';font-weight:600;font-size:1rem;cursor:pointer;border:0;
    padding:14px 26px;border-radius:10px;background:var(--ink);color:var(--paper);
    display:inline-flex;align-items:center;gap:10px;transition:transform .12s,background .2s,box-shadow .2s;
    box-shadow:0 10px 24px -12px rgba(13,27,42,.6);
  }
  .btn:hover{background:var(--red);transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;background:var(--ink)}
  .btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:14px 8px}
  .btn.ghost:hover{color:var(--ink);background:transparent}
  .enter-hint{font-size:.8rem;color:var(--muted)}
  .enter-hint kbd{font-family:'Inter';font-weight:600;background:var(--paper-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:.78rem;color:var(--ink)}
  .skip-hint{font-size:.8rem;color:var(--muted)}
  .err{color:var(--red);font-size:.85rem;margin-top:12px;font-weight:500;display:none}
  .err.show{display:block}

  .intro-art{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap-reverse}
  .intro-copy{flex:1 1 340px;min-width:280px}
  .flag{flex:0 0 auto;width:118px;height:auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:6px solid #fff;transform:rotate(-3deg)}
  .flag svg{display:block;width:100%;height:auto}
  .anon-note{margin-top:26px;border:1.5px dashed var(--gold);border-radius:14px;padding:18px 20px;background:#fff;font-size:.95rem;line-height:1.55;color:var(--ink-2)}
  .anon-note b{color:var(--ink)}

  .summary{margin-top:26px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.5)}
  .summary .row{display:flex;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line);font-size:.95rem}
  .summary .row:last-child{border-bottom:0}
  .summary .row span{color:var(--muted);flex:0 0 auto;max-width:45%}
  .summary .row b{font-weight:600;text-align:right}

  .done-mark{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin-bottom:24px;box-shadow:0 14px 30px -12px var(--ok)}
  .done-mark svg{width:30px;height:30px;stroke:#fff;stroke-width:3;fill:none}
  .meet{margin-top:26px;border:1.5px dashed var(--gold);border-radius:14px;padding:20px;background:#fff}
  .meet .lab{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .meet .cal{margin-top:6px;font-size:1rem;color:var(--ink-2);line-height:1.6}
  .meet .cal b{font-family:'Fraunces';color:var(--ink)}

  .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:560px){
    .slide{padding:88px 22px 110px}
    .choices.grid2{grid-template-columns:1fr}
    #brand .wm{display:none}
    .foot{gap:12px}
    .scale{gap:7px}
  }
  @media (prefers-reduced-motion:reduce){
    .slide{transition:opacity .2s}
    .choice:hover,.scale button:hover{transform:none}
  }

  #lang{position:fixed;top:22px;right:26px;z-index:30;display:inline-flex;
    border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.55);
    font-family:'Inter';font-weight:600;font-size:.78rem}
  #lang button{border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer;
    transition:.18s;letter-spacing:.03em}
  #lang button.on{background:var(--ink);color:var(--paper)}
  #lang button:not(.on):hover{color:var(--ink)}
  @media (max-width:560px){#lang{top:18px;right:16px}}
</style>
</head>

function tr(){ return T[lang]; }

/* ---------- build step list from current language ---------- */
function buildSteps(){
  const t=tr();
  const arr=[{type:'intro'}];
  t.steps.forEach((s,i)=>{
    let type='input';
    if(s.options) type=s.multi?'multi':'choice';
    else if(s.textarea) type='textarea';
    else if(s.scale) type='scale';
    else if(s.gridRate) type='gridrate';
    arr.push(Object.assign({type, input:s.input||'text', n:i+1, required:!s.optional}, s));
  });
  arr.push({type:'review'});
  arr.push({type:'done'});
  return arr;
}

let letterKeys = [];

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function qCount(){ return steps.filter(s=>s.n).length; }

function renderDeck(){
  deck.innerHTML='';
  steps.forEach((st,i)=>{
    const el=document.createElement('section');
    el.className='slide';el.dataset.i=i;
    el.innerHTML=buildSlide(st);
    deck.appendChild(el);
  });
}

function buildSlide(st){
  const t=tr();
  if(st.type==='intro') return introHTML();
  if(st.type==='done')  return doneHTML();
  if(st.type==='review')return reviewHTML();

  const eb = `<div class="eyebrow"><span class="n"><b>${st.n}</b>/${qCount()}</span> ${esc(st.eyebrow)}</div>`;
  const hint = st.hint?`<p class="q-hint">${esc(st.hint)}</p>`:'';
  let body='';

  if(st.type==='input'){
    body=`<div class="field"><input type="${st.input}" data-inp placeholder="${esc(st.placeholder)}" autocomplete="off"></div>`;
  }
  if(st.type==='textarea'){
    body=`<div class="field"><textarea data-inp placeholder="${esc(st.placeholder||'')}"></textarea></div>`;
  }
  if(st.type==='scale'){
    const n=st.scale, start=st.zero?0:1;
    const caps = st.npsLabel?t.nps:t.scaleCaps;
    const wide = n>6?' wide':'';
    let btns='';
    for(let v=start; v<start+n; v++){
      const lowCap = v===start?`<span class="cap">${esc(caps.low)}</span>`:'';
      const highCap = v===start+n-1?`<span class="cap">${esc(caps.high)}</span>`:'';
      const cap = (v===start||v===start+n-1)?(v===start?lowCap:highCap):'<span class="cap">&nbsp;</span>';
      btns+=`<button data-scale data-key="${esc(st.key)}" data-v="${v}">${v}${cap}</button>`;
    }
    body=`<div class="scale${wide}">${btns}</div>`;
  }
  if(st.type==='gridrate'){
    const rows=st.rows.map(r=>{
      let cells='';
      for(let v=1;v<=5;v++) cells+=`<button data-gridrate data-key="${esc(st.key)}" data-row="${esc(r.k)}" data-v="${v}">${v}</button>`;
      return `<div class="gr-row"><div class="gr-lbl">${esc(r.l)}</div><div class="gr-scale">${cells}</div></div>`;
    }).join('');
    body=`<div class="grid-rate">${rows}</div>`;
  }
  if(st.type==='choice'||st.type==='multi'){
    const cls = st.grid?'choices grid2':'choices';
    const multi = st.type==='multi';
    const opts = st.options.map((o,j)=>{
      const k=String.fromCharCode(65+j);
      const sub=o.s?`<small>${esc(o.s)}</small>`:'';
      return `<button class="choice${multi?' multi':''}" data-choice data-multi="${multi?1:0}" data-key="${esc(st.key)}" data-idx="${j}" data-k="${k}">
        <span class="key">${k}</span>
        <span class="lbl"><b>${esc(o.v)}</b>${sub}</span>
      </button>`;
    }).join('');
    body=`<div class="${cls}">${opts}</div>`;
  }

  const errText = (st.type==='choice'||st.type==='multi')?t.errPick:t.errAnswer;
  const skipHint = st.optional
    ? `<span class="skip-hint">${esc(t.optional)}</span>`
    : `<span class="enter-hint">${esc(t.press)} <kbd>${esc(t.enter)} ↵</kbd></span>`;
  const nextLabel = st.optional ? t.skip : t.ok;

  return `<div class="wrap">
    ${eb}<h2>${esc(st.q)}</h2>${hint}${body}
    <div class="err" data-err>${esc(errText)}</div>
    <div class="foot">
      <button class="btn" data-next>${esc(nextLabel)} <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></button>
      ${skipHint}
    </div>
  </div>`;
}

/* ---------- navigation ---------- */
let slides=[];
function refreshSlides(){ slides=[...deck.children]; }

function show(n){
  idx=n;
  slides.forEach((s,i)=>{
    s.classList.toggle('active',i===idx);
    s.classList.toggle('up',i<idx);
  });
  $('#rail span').style.width=(idx/(steps.length-1))*100+'%';
  const st=steps[idx], t=tr();
  const isQ = !!st.n;
  $('#counter').innerHTML = isQ?`${esc(t.q)} <b>${st.n}</b> ${esc(t.of)} ${qCount()}`:'';

  const inp=$('[data-inp]',slides[idx]);
  if(inp){ inp.value=data[st.key]||''; setTimeout(()=>inp.focus(),300); }

  // restore selections
  if(st.type==='choice'){
    slides[idx].querySelectorAll('.choice').forEach(c=>{
      const j=+c.dataset.idx;
      c.classList.toggle('sel', canonOpt(st.key,j)===data[st.key]);
    });
    letterKeys=st.options.map((o,j)=>String.fromCharCode(65+j).toLowerCase());
  } else if(st.type==='multi'){
    const arr=data[st.key]||[];
    slides[idx].querySelectorAll('.choice').forEach(c=>{
      const j=+c.dataset.idx;
      c.classList.toggle('sel', arr.includes(canonOpt(st.key,j)));
    });
    letterKeys=st.options.map((o,j)=>String.fromCharCode(65+j).toLowerCase());
  } else if(st.type==='scale'){
    slides[idx].querySelectorAll('[data-scale]').forEach(b=>
      b.classList.toggle('sel', String(data[st.key])===b.dataset.v));
    letterKeys=[];
  } else if(st.type==='gridrate'){
    const obj=data[st.key]||{};
    slides[idx].querySelectorAll('[data-gridrate]').forEach(b=>
      b.classList.toggle('sel', String(obj[b.dataset.row])===b.dataset.v));
    letterKeys=[];
  } else letterKeys=[];

  if(st.type==='review') fillSummary();
  if(st.type==='done') fireSubmit();
}

/* canonical (English) option value for a step + index */
function canonOpt(stepKey, j){
  const en=T.en.steps.find(s=>s.key===stepKey);
  return en.options[j].v;
}
function dispOpt(stepKey, canonVal){
  const en=T.en.steps.find(s=>s.key===stepKey);
  const j=en.options.findIndex(o=>o.v===canonVal);
  if(j<0) return canonVal;
  return tr().steps.find(s=>s.key===stepKey).options[j].v;
}

function fillSummary(){
  const t=tr();
  const rows=[];
  t.steps.forEach(s=>{
    const v=data[s.key];
    if(v===undefined||v===''||(Array.isArray(v)&&!v.length)) return;
    let shown;
    if(s.gridRate){
      shown = s.rows.map(r=>`${r.l}: ${ (data[s.key]||{})[r.k] || '—' }`).join(' · ');
    } else if(s.options && s.multi){
      shown = v.map(cv=>dispOpt(s.key,cv)).join(', ');
    } else if(s.options){
      shown = dispOpt(s.key,v);
    } else {
      shown = v;
    }
    // question label: strip trailing punctuation, keep it short
    rows.push([s.eyebrow, shown]);
  });
  // de-dup consecutive eyebrows into their own line is overkill; show Q + answer
  const html = t.steps.filter(s=>{
    const v=data[s.key];
    return !(v===undefined||v===''||(Array.isArray(v)&&!v.length));
  }).map(s=>{
    let shown;
    if(s.gridRate){
      shown = s.rows.map(r=>`${r.l}: ${ (data[s.key]||{})[r.k] || '—' }`).join(' · ');
    } else if(s.options && s.multi){
      shown = (data[s.key]||[]).map(cv=>dispOpt(s.key,cv)).join(', ');
    } else if(s.options){
      shown = dispOpt(s.key,data[s.key]);
    } else shown = data[s.key];
    const label = s.q.length>52 ? s.q.slice(0,50)+'…' : s.q;
    return `<div class="row"><span>${esc(label)}</span><b>${esc(String(shown))}</b></div>`;
  }).join('');
  $('[data-summary]',slides[idx]).innerHTML = html || `<div class="row"><span>—</span><b>—</b></div>`;
}

function validate(){
  const st=steps[idx], t=tr();
  const err=$('[data-err]',slides[idx]);
  if(st.type==='input'||st.type==='textarea'){
    const v=$('[data-inp]',slides[idx]).value.trim();
    if(st.required&&!v){flash(err,t.errAnswer);return false;}
    if(st.input==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){flash(err,t.errEmail);return false;}
    data[st.key]=v;
  }
  if((st.type==='choice'||st.type==='scale')&&st.required&&(data[st.key]===undefined||data[st.key]==='')){
    flash(err,t.errPick);return false;
  }
  if(st.type==='multi'&&st.required&&(!data[st.key]||!data[st.key].length)){
    flash(err,t.errPick);return false;
  }
  if(st.type==='gridrate'&&st.required){
    const obj=data[st.key]||{};
    if(st.rows.some(r=>obj[r.k]===undefined)){flash(err,t.errPick);return false;}
  }
  if(err)err.classList.remove('show');
  return true;
}
function flash(el,msg){if(el){el.textContent=msg;el.classList.add('show');}}

function next(){ if(!validate())return; if(idx<steps.length-1)show(idx+1); }
function prev(){ if(idx>0)show(idx-1); }

/* ---------- events ---------- */
deck.addEventListener('click',e=>{
  if(e.target.closest('[data-next]'))next();
  if(e.target.closest('[data-edit]'))prev();

  const ch=e.target.closest('[data-choice]');
  if(ch){
    const stepKey=ch.dataset.key;
    const slide=ch.closest('.slide');
    const isMulti=ch.dataset.multi==='1';
    const j=+ch.dataset.idx;
    const canon=canonOpt(stepKey,j);
    if(isMulti){
      const arr=data[stepKey]?[...data[stepKey]]:[];
      const at=arr.indexOf(canon);
      if(at>=0){arr.splice(at,1);ch.classList.remove('sel');}
      else{arr.push(canon);ch.classList.add('sel');}
      data[stepKey]=arr;
      $('[data-err]',slide)?.classList.remove('show');
    } else {
      slide.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));
      ch.classList.add('sel');
      data[stepKey]=canon;
      $('[data-err]',slide)?.classList.remove('show');
      if(slide.classList.contains('active')) setTimeout(()=>{ if(slide.classList.contains('active')) next(); },340);
    }
  }

  const sc=e.target.closest('[data-scale]');
  if(sc){
    const slide=sc.closest('.slide');
    slide.querySelectorAll('[data-scale]').forEach(b=>b.classList.remove('sel'));
    sc.classList.add('sel');
    data[sc.dataset.key]=+sc.dataset.v;
    $('[data-err]',slide)?.classList.remove('show');
    if(slide.classList.contains('active')) setTimeout(()=>{ if(slide.classList.contains('active')) next(); },340);
  }

  const gr=e.target.closest('[data-gridrate]');
  if(gr){
    const slide=gr.closest('.slide');
    const key=gr.dataset.key, row=gr.dataset.row;
    slide.querySelectorAll(`[data-gridrate][data-row="${row}"]`).forEach(b=>b.classList.remove('sel'));
    gr.classList.add('sel');
    data[key]=Object.assign({}, data[key]||{}, {[row]:+gr.dataset.v});
    $('[data-err]',slide)?.classList.remove('show');
  }

  if(e.target.closest('[data-submit]'))submit();
});

document.addEventListener('keydown',e=>{
  const st=steps[idx];
  if(e.key==='Enter'){
    if(st.type==='textarea' && !e.metaKey && !e.ctrlKey) return; // allow newlines
    if(st.type==='review'){submit();return;}
    if(st.type==='done')return;
    e.preventDefault();next();
  }
  if((st.type==='choice'||st.type==='multi')&&letterKeys.includes(e.key.toLowerCase())){
    const c=slides[idx].querySelector(`.choice[data-k="${e.key.toUpperCase()}"]`);
    if(c)c.click();
  }
});

/* ---------- language toggle ---------- */
function setLang(l){
  if(l===lang) return;
  lang=l;
  document.documentElement.lang=l;
  syncLangButtons();
  steps=buildSteps();
  const keep=idx;
  renderDeck(); refreshSlides();
  show(Math.min(keep, steps.length-1));
}
function syncLangButtons(){
  document.querySelectorAll('#lang button').forEach(b=>
    b.classList.toggle('on', b.dataset.lang===lang));
}
document.querySelectorAll('#lang button').forEach(b=>
  b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* ---------- submit ---------- */
let submitted=false;
function submit(){
  if(submitted)return;
  const btn=$('[data-submit]',slides[idx]);
  const err=$('[data-err]',slides[idx]);
  const t=tr();
  err?.classList.remove('show');

  const payload={ formType:'feedback', lang:lang, ts:new Date().toISOString() };
  T.en.steps.forEach(s=>{
    let v=data[s.key];
    if(Array.isArray(v)) v=v.join('; ');
    else if(v&&typeof v==='object') v=Object.keys(v).map(k=>`${k}:${v[k]}`).join('; ');
    payload[s.key]= v===undefined?'':v;
  });

  if(!ENDPOINT){ submitted=true; show(steps.length-1); return; }
  btn.disabled=true; btn.innerHTML=`<span class="spin"></span> ${esc(t.sending)}`;
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)})
    .then(()=>{ submitted=true; show(steps.length-1); })
    .catch(()=>{
      btn.disabled=false;btn.textContent=t.review.confirm;
      flash(err,t.errSave);
    });
}
function fireSubmit(){ if(!ENDPOINT&&!submitted)submitted=true; }

/* ---------- init ---------- */
syncLangButtons();
renderDeck(); refreshSlides();
show(0);
</script>
